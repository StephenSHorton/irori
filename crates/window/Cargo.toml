[package]
name = "irori-window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The window's backend: every service method the frontend calls as a Tauri command, its events, settings and the attachments protocol"

[lib]
name = "irori_window"

[dependencies]
irori-blob.workspace = true
irori-capture.workspace = true
irori-coord.workspace = true
irori-core.workspace = true
irori-gocompat.workspace = true
irori-identity.workspace = true
irori-inbox.workspace = true
irori-notify.workspace = true
irori-pair.workspace = true
irori-ledger.workspace = true
irori-mesh.workspace = true
irori-presence.workspace = true
irori-store.workspace = true
irori-sys.workspace = true
irori-tools.workspace = true
base64.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["specta"] }
tauri-specta.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
# tests/pumps.rs: pairing on loopback iroh.
iroh = "1.4.1"
irori-net.workspace = true
irori-identity.workspace = true
# tests/mesh.rs: the Devices window on two and three loopback Cores.
irori-home.workspace = true
irori-lan.workspace = true
