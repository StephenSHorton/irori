[package]
name = "irori-invite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Irori's board invite (shared boards stage 2, design v0.5-shared-boards §4.1, architecture §3.3): the irori-invite ticket, the code-derived invite room, person-key proofs, the five words, and the board bundle"

[lib]
name = "irori_invite"

[dependencies]
irori-gocompat.workspace = true
irori-identity.workspace = true
irori-mesh.workspace = true
irori-meshseam.workspace = true
irori-pair.workspace = true
irori-store.workspace = true
base64.workspace = true
data-encoding.workspace = true
hex.workspace = true
hmac = "0.13.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
zeroize.workspace = true

[dev-dependencies]
irori-hlc.workspace = true
irori-net.workspace = true
iroh = "1.4.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
