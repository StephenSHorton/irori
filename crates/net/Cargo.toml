[package]
name = "irori-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Irori below the mesh seam: iroh endpoint keyed by the device key, embedded iroh-relay (M1 spike)"

[lib]
name = "irori_net"

[[bin]]
name = "spike-net"
path = "src/bin/spike-net.rs"

[dependencies]
irori-identity.workspace = true
irori-lan.workspace = true
irori-meshseam.workspace = true
iroh-gossip = { version = "0.101.0", default-features = false, features = ["net"] }
hmac = "0.13.0"
sha2.workspace = true
n0-future = "0.3.2"
n0-error = "1.0.1"
tokio-util.workspace = true
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", features = ["server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring", "std"] }
rcgen = "0.14.10"
tokio = { version = "1.54", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# The mesh Node on IrohNet (tests/node_iroh.rs) and its FakeNet harness.
irori-mesh.workspace = true
irori-blob.workspace = true
hex.workspace = true
tokio-util.workspace = true
# net_report() lets the loopback tests see a QAD round trip; tests only.
iroh = { version = "1.4.1", features = ["unstable-net-report"] }
tempfile = "3.27"
getrandom = "0.4"
# The identity test harness (crates/identity/tests/support), shared by path.
irori-store.workspace = true
irori-gocompat.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
