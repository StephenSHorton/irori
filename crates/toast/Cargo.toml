[package]
name = "irori-toast"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Irori's cards: a native port of go-toast v0.2.0 (Win32 layered windows, AppKit panels)"

[lib]
name = "toast"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The AppKit side (src/darwin.rs). It cannot be compiled on the PC; the Mac
# builds and checks it (crates/toast/MAC.md). These crates are already in
# Cargo.lock through tauri, and their default features enable every module.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
dispatch2 = "0.3.1"
block2 = "0.6.2"
