[package]
name = "irori-home"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Irori's home server: the embedded iroh relay on the device key, port mapping, node.addr rows and the keep-awake hold (mesh.md §3.3, §5.4)"

[lib]
name = "home"

[dependencies]
irori-gocompat.workspace = true
irori-identity.workspace = true
irori-lan.workspace = true
# `servers::NodeAddr`, the one copy of Go `mesh.NodeAddr`.
irori-mesh.workspace = true
# `admit::admitted_device`, the one copy of Go `mesh.CheckDevice`, and the
# relay TLS (`tls::server_config_on_seed`).
irori-net.workspace = true
irori-store.workspace = true
irori-sys.workspace = true
getrandom.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
tokio = { version = "1.54", features = ["net", "rt", "sync", "time", "macros"] }
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", features = ["server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
socket2 = "0.6.5"
igd-next = { version = "0.17.1", features = ["aio_tokio"] }

[dev-dependencies]
irori-hlc.workspace = true
irori-meshseam.workspace = true
tempfile.workspace = true
tokio = { version = "1.54", features = ["full"] }
