[package]
name = "irori-lan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Irori's sealed LAN lookup on UDP 38419 (D6, mesh.md §5.3) as an iroh AddressLookup, and this machine's networks"

[lib]
name = "irori_lan"

[dependencies]
iroh = "1.4.1"
n0-future = "0.3.2"
crypto_secretbox = "0.1.1"
getrandom.workspace = true
netdev = "0.46.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6.5"
tokio = { version = "1.54", features = ["net", "rt", "sync", "time", "macros"] }
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_Ole",
] }

[dev-dependencies]
tokio = { version = "1.54", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
