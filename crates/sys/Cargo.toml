[package]
name = "irori-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OS glue for Irori: process liveness and exit waits, file-change watching, the local UTC offset (capture.md §4), the keep-awake hold (inbox.md §4)"

[lib]
name = "sys"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
