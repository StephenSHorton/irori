[package]
name = "irori-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Irori identity: device.json, keys and keystores, person certs, the Chain and BoardVerifier folds, board secrets, the owner table"

[lib]
name = "irori_identity"

[dependencies]
irori-gocompat.workspace = true
irori-store.workspace = true
serde.workspace = true
thiserror.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
zeroize.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
gethostname.workspace = true
hkdf.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
