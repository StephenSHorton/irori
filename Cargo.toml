[workspace]
resolver = "3"
# Crates are added as their milestone builds them (docs/architecture.md section 1, 8).
members = [
  "app",
  "crates/api",
  "crates/attach",
  "crates/blob",
  "crates/capture",
  "crates/coord",
  "crates/core",
  "crates/dev",
  "crates/gocompat",
  "crates/hlc",
  "crates/home",
  "crates/identity",
  "crates/inbox",
  "crates/invite",
  "crates/lan",
  "crates/ledger",
  "crates/meshseam",
  "crates/net",
  "crates/pair",
  "crates/presence",
  "crates/scrub",
  "crates/search",
  "crates/store",
  "crates/sys",
  "crates/mcp",
  "crates/mesh",
  "crates/tools",
  "crates/window",
  "tools/xtask",
  "crates/toast",
  "crates/notify",
  "crates/update",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-plugin-single-instance = "2.5.5"
tauri-build = "2.7.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tempfile = "3.27.0"
irori-api = { path = "crates/api" }
irori-attach = { path = "crates/attach" }
irori-blob = { path = "crates/blob" }
irori-coord = { path = "crates/coord" }
irori-core = { path = "crates/core" }
irori-gocompat = { path = "crates/gocompat" }
irori-hlc = { path = "crates/hlc" }
irori-home = { path = "crates/home" }
irori-identity = { path = "crates/identity" }
irori-inbox = { path = "crates/inbox" }
irori-invite = { path = "crates/invite" }
irori-lan = { path = "crates/lan" }
irori-ledger = { path = "crates/ledger" }
irori-meshseam = { path = "crates/meshseam" }
irori-net = { path = "crates/net" }
irori-pair = { path = "crates/pair" }
irori-presence = { path = "crates/presence" }
irori-scrub = { path = "crates/scrub" }
irori-search = { path = "crates/search" }
irori-store = { path = "crates/store" }
irori-capture = { path = "crates/capture" }
irori-sys = { path = "crates/sys" }
irori-mcp = { path = "crates/mcp" }
irori-mesh = { path = "crates/mesh" }
irori-tools = { path = "crates/tools" }
irori-window = { path = "crates/window" }
irori-toast = { path = "crates/toast" }
irori-notify = { path = "crates/notify" }
irori-update = { path = "crates/update" }
aho-corasick = "1.1.5"
flate2 = "1.1.10"
libc = "0.2.191"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
rusqlite = { version = "0.41.1", features = ["bundled"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
# The invite ticket (crates/invite), already in the tree through iroh.
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
gethostname = "1.1.0"
hex = "0.4.3"
hkdf = "0.13.0"
# NaCl secretbox (XSalsa20-Poly1305) for person.secret (crates/mesh).
crypto_secretbox = "0.1.1"
regex = "1.13.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
stacker = "0.1.25"
thiserror = "2.0.21"
windows-sys = "0.61.2"
# Launch at login (architecture.md D9): the HKCU Run key on Windows,
# SMAppService on macOS.
winreg = "0.56.0"
objc2-service-management = "0.3.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
zeroize = "1.9.1"
# The attach stream and runner (crates/attach): loopback HTTP/1.1.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
bytes = "1.12.1"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-util = "0.1.21"
# Constant-time token compare (crates/api).
subtle = "2.6.1"
# The window's generated bindings (D10): release candidates, pinned with =
# (architecture.md 1.3); tauri-specta rc.26 wants specta-typescript 0.0.13.
specta = { version = "=2.0.0-rc.26", features = ["derive", "function", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }

[profile.release]
codegen-units = 1
lto = true

# The board fold tests run every arrival order of a log (up to 7! = 5040
# verifiers, each checking signatures); unoptimized curve arithmetic makes
# them crawl in debug builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# scrub runs every rule over 4 MiB patches with Go's time bounds
# (BigPatchTime, LongLineTime); unoptimized regex engines miss them.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

# The pairing room is scrypt(N=2^15, r=8) of the code (crates/pair); in an
# unoptimized build each derivation outlasts the flow tests' short windows.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
