[package]
name = "irori-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The irori binary: every CLI role and the Rune window (rune-ui spike, card #674: no Tauri, no webview)"

[[bin]]
name = "irori"
path = "src/main.rs"

[dependencies]
irori-roles = { workspace = true }
irori-core = { workspace = true }
irori-sys = { workspace = true }
irori-notify = { workspace = true }
# The window's services (their Tauri commands went with the frontend).
irori-window = { workspace = true }
# The updater and Keep this device up to date (status/updater.rs, keep.rs):
# whether an agent is working, and the home server's switch.
irori-update = { workspace = true }
irori-presence = { workspace = true }
irori-coord = { workspace = true }
irori-home = { workspace = true }
# Launch at login (login/winrun.rs): Go's quoting of the Run value.
irori-gocompat = { workspace = true }
tokio = { workspace = true }
png = { workspace = true }
libc = { workspace = true }
# Rune (github.com/StephenSHorton/rune, the person's fork), pinned: Rune is
# pre-release and asks for a rev of dev. Its ogg-audio (symphonia) and
# native-file-dialog stay off.
rune = { git = "https://github.com/StephenSHorton/rune", rev = "5fd9bfa2ec89e6325d6435d95066336d93369d69", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "svg"] }
# Rune's components (dialogs, menus, sidebar, toasts, markdown), same rev.
rune-kit = { git = "https://github.com/StephenSHorton/rune", rev = "5fd9bfa2ec89e6325d6435d95066336d93369d69", features = ["markdown"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# status/updater.rs's card tests: a fake card system.
irori-toast = { workspace = true }
# tests/it/attach_exe.rs: the real binary against a Core behind the API server.
irori-api = { workspace = true }
irori-identity = { workspace = true }
irori-inbox = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde_json = { workspace = true }
tokio-util = { workspace = true }
irori-gocompat = { workspace = true }
irori-attach = { workspace = true }

# The Mac's menu-bar item: Rune's Tray is Windows and Linux only.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.25.1"
# Launch at login (login/macos.rs): SMAppService.mainAppService.
objc2-service-management = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSBundle", "NSError", "NSString"] }

# Launch at login (login/winrun.rs): the HKCU Run value.
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

# app/build.rs: the exe's icon, version resource and manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
