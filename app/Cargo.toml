[package]
name = "irori-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The irori binary: every CLI role and the Rune window (rune-ui spike, card #674: no Tauri, no webview)"

# The window's packages as a library: the desktop binary below, and the
# Android prototype (card #680), which links it as a cdylib that Rune's
# Kotlin host (RuneActivity) loads: app/android, scripts/android-rune.sh.
# Built as an rlib here so desktop builds never link a .so; the Android
# script asks for the cdylib with `cargo rustc --crate-type cdylib`.
[lib]
name = "irori_app"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "irori"
path = "src/main.rs"

[dependencies]
irori-roles = { workspace = true }
irori-core = { workspace = true }
irori-sys = { workspace = true }
irori-notify = { workspace = true }
# The window's services (their Tauri commands went with the frontend).
irori-window = { workspace = true }
# The updater and Keep this device up to date (status/updater.rs, keep.rs):
# whether an agent is working, and the home server's switch.
irori-update = { workspace = true }
irori-presence = { workspace = true }
irori-coord = { workspace = true }
irori-home = { workspace = true }
# Launch at login (login/winrun.rs): Go's quoting of the Run value.
irori-gocompat = { workspace = true }
tokio = { workspace = true }
png = { workspace = true }
libc = { workspace = true }
# Rune (github.com/StephenSHorton/rune, the person's fork), pinned: Rune is
# pre-release and asks for a rev of dev. d0ffeb2 is the fork branch card-674-gaps:
# dev 064a411 plus the gap fixes for the port (caret popups, multi-file picks,
# dialogs that wrap, kit widgets, dashes, mono, WebP, tray checks). 064a411 is 5fd9bfa plus the Android
# shell and its on-screen keyboard (#677, #679). Its ogg-audio (symphonia) and
# native-file-dialog stay off.
rune = { git = "https://github.com/StephenSHorton/rune", rev = "d0ffeb298113f2ad99353836e77cbceefe999e41", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "native-file-dialog", "svg"] }
# Rune's components (dialogs, menus, sidebar, toasts, markdown), same rev.
rune-kit = { git = "https://github.com/StephenSHorton/rune", rev = "d0ffeb298113f2ad99353836e77cbceefe999e41", features = ["markdown"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The text package (app/src/text): rich text's links (regex, and url for
# safeHref's WHATWG parse), and the composer's files (base64 for UploadFile).
# The widgets' and logic's needs: lease names (logic/wait_name.rs), held
# deliveries (logic/needs.rs), the person's avatar data URL (widgets/avatar.rs).
regex = { workspace = true }
url = "2.5"
base64 = { workspace = true }
irori-inbox = { workspace = true }
# Decodes the person's avatar (PNG, JPEG or WebP data URL; Rune's own
# decoder has no WebP), and Settings/Profile crop and shrink it
# (lib/avatar.ts). The same image crate Rune pulls in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Watching a huddle's screen share (#658, P6): H.264 on the platform's
# decoder (VideoToolbox, Media Foundation) through moq-video, the crate
# crates/share encodes with; hang and moq-net for the two types its decoder
# takes. Same pins as crates/share.
moq-video = { version = "=0.1.21", default-features = false }
hang = "=0.21.22"
moq-net = "=0.3.21"
bytes = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# status/updater.rs's card tests: a fake card system.
irori-toast = { workspace = true }
# tests/it/attach_exe.rs: the real binary against a Core behind the API server.
irori-api = { workspace = true }
irori-identity = { workspace = true }
irori-inbox = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde_json = { workspace = true }
tokio-util = { workspace = true }
irori-gocompat = { workspace = true }
irori-attach = { workspace = true }

# The Mac's menu-bar item: Rune's Tray is Windows and Linux only.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.25.1"
# Launch at login (login/macos.rs): SMAppService.mainAppService.
objc2-service-management = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSBundle", "NSError", "NSString"] }

# Launch at login (login/winrun.rs): the HKCU Run value.
[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

# app/build.rs: the exe's icon, version resource and manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
