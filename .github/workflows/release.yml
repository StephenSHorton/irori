name: Release

# Cut a release by pushing a semver tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run it from the Actions tab with a tag). A tag with a "-" (v0.2.0-rc.1)
# becomes a prerelease, which the in-app updater ignores (/releases/latest).
#
# The updater (internal/update) looks for an asset named
# irori-<version>-windows-<arch>-installer.exe on Windows and
# irori-<version>-macos-<arch>.app.zip on macOS, and REQUIRES a SHA256SUMS
# asset listing it. Keep those names in step with internal/update/release.go
# (TestReleaseWorkflowAssetNames checks them).
#
# A dry run (Run workflow with dry_run ticked) builds and tests both
# platforms from the branch it was started on and keeps the assets as
# workflow artifacts: no tag has to exist and no GitHub Release is made. The
# tag input then only names the version that gets stamped in.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); in a dry run, the version to stamp"
        required: true
      dry_run:
        description: "Dry run: build the Windows and macOS assets from this branch, no release"
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A dry run builds the branch it was started on; a release, the tag.
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install wails3 CLI and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.98
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "tag $tag is not vX.Y.Z" }
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # The Win32 resource and NSIS want a bare X.Y.Z (no prerelease part).
          "numeric=$($version -replace '[-+].*$', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $tag (version $version)"

      # internal/capture drives real git in temp repos and its timing tests
      # can flake under full parallel load, so it runs alone, with one retry.
      - name: Test
        shell: bash
        run: |
          go test $(go list ./internal/... | grep -v '/internal/capture$')
          go test -p 1 ./internal/capture || go test -p 1 -count=1 ./internal/capture

      - name: Stamp version into the Win32 resource (info.json)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.numeric }}"
          $p = "build/windows/info.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.fixed.file_version = $v
          $j.info.'0000'.ProductVersion = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content $p
          Get-Content $p

      # The steps below are build/windows/Taskfile.yml's build + package, run
      # one at a time: the task runner starts bun install and go mod tidy in
      # parallel, which trips Windows file locks on CI. frontend/bindings is
      # committed, so it is not regenerated here.
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build irori.exe (version injected)
        shell: pwsh
        run: |
          Push-Location build
          wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso
          Pop-Location
          $env:CGO_ENABLED = "0"
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o bin/irori.exe .
          Remove-Item *.syso

      - name: Build NSIS installer (per-user, no UAC)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          # Quote each -D: PowerShell otherwise splits "...=0.1.0" at the dots.
          makensis "-DINFO_PRODUCTVERSION=${{ steps.ver.outputs.numeric }}" "-DWAILS_INSTALL_SCOPE=user" "-DREQUEST_EXECUTION_LEVEL=user" "-DARG_WAILS_AMD64_BINARY=$root\bin\irori.exe" build/windows/nsis/project.nsi

      - name: Assemble assets (installer, portable zip, SHA256SUMS)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $installer = "irori-$v-windows-amd64-installer.exe"
          $zip       = "irori-$v-windows-amd64.zip"
          Copy-Item "bin/irori-amd64-installer.exe" "dist-release/$installer"
          Compress-Archive -Path "bin/irori.exe" -DestinationPath "dist-release/$zip" -Force
          Get-ChildItem dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: irori-windows-amd64
          path: dist-release/*
          if-no-files-found: error

  # Apple silicon only for now: macos-latest is an arm64 runner, and a
  # universal app would need a second (x86_64) cgo build and lipo.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then echo "tag $tag is not vX.Y.Z" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Building $tag for macOS arm64"

      # The frontend first: package main embeds frontend/dist.
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      # internal/capture's git timing tests run alone, with retries (ci.yml).
      - name: Test
        shell: bash
        run: |
          go test $(go list ./... | grep -v '/internal/capture$')
          for i in 1 2 3; do go test -p 1 -count=1 ./internal/capture && break; [ $i = 3 ] && exit 1; done

      # cgo is required (Wails' AppKit and WebKit glue, FSEvents). The
      # deployment target matches Info.plist's LSMinimumSystemVersion.
      - name: Build irori (version injected)
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CGO_CFLAGS: "-mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0"
        run: |
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version=${{ steps.ver.outputs.version }}" -o bin/irori .
          file bin/irori

      # Developer ID signing happens only when the secrets exist; without
      # them the app is signed ad hoc, which Gatekeeper treats as unsigned.
      # Secrets can't be read in `if:`, so the step checks in the shell.
      - name: Import Apple signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            echo "No MACOS_CERTIFICATE_P12_BASE64: the app is signed ad hoc."
            exit 0
          fi
          cert="$RUNNER_TEMP/irori-dev-id.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$cert" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning
          rm -f "$cert"

      - name: Package Irori.app, .app.zip and .dmg
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          appzip="irori-$v-macos-arm64.app.zip"
          dmg="irori-$v-macos-arm64.dmg"
          # Developer ID without notarization credentials still signs.
          if [[ -z "${APPLE_ID:-}" && -z "${APPLE_API_KEY_ID:-}" ]]; then export IRORI_NOTARIZE=0; fi
          bash build/darwin/package.sh --binary bin/irori --version "$v" --out dist-mac --zip "$appzip" --dmg "$dmg"
          mkdir -p dist-release
          cp "dist-mac/$appzip" "dist-mac/$dmg" dist-release/
          ls -la dist-release

      # The bundled binary runs and reports the stamped version, and the
      # desktop app started from the bundle (throwaway data folder) is still
      # running 20 s later: no crash at launch.
      - name: Smoke test the app
        shell: bash
        run: |
          set -euo pipefail
          exe="dist-mac/Irori.app/Contents/MacOS/irori"
          out="$("$exe" version)"
          echo "$out"
          [ "$out" = "irori ${{ steps.ver.outputs.version }}" ]
          export IRORI_HOME="$RUNNER_TEMP/irori-home"
          "$exe" > "$RUNNER_TEMP/gui.log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid"; then
            echo "the desktop app exited early:"
            cat "$RUNNER_TEMP/gui.log"
            exit 1
          fi
          echo "the desktop app is still running after 20 s"
          kill "$pid"
          ls -la "$IRORI_HOME" || true
          cat "$RUNNER_TEMP/gui.log"

      - uses: actions/upload-artifact@v4
        with:
          name: irori-macos-arm64
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: [windows, macos]
    # A dry run stops at the workflow artifacts.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows.outputs.tag }}
          name: Irori ${{ needs.windows.outputs.tag }}
          prerelease: ${{ contains(needs.windows.outputs.tag, '-') }}
          generate_release_notes: true
          files: assets/*
