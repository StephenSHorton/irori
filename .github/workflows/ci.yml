name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The frontend builds first: package main embeds frontend/dist, so vet
      # and test need it. frontend/bindings is committed; after changing a Go
      # service run `wails3 generate bindings -clean=true -ts` and commit it.
      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend build
        working-directory: frontend
        run: bun run build

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      # -race needs cgo; the macOS runner has clang, the Windows one may not.
      - name: Test
        shell: bash
        run: |
          # internal/capture's git timing tests run alone, with one retry.
          race=""; [ "$RUNNER_OS" = "macOS" ] && race="-race"
          go test $race $(go list ./... | grep -v '/internal/capture$')
          # Up to three tries: these tests are timing-sensitive, worst on the
          # macOS runner (owed: make them deterministic).
          for i in 1 2 3; do go test $race -p 1 -count=1 ./internal/capture && break; [ $i = 3 ] && exit 1; done

      - name: Build
        run: go build ./...
