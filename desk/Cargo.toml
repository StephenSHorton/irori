[package]
name = "irori-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The irori desktop binary with a Rune window: every CLI role, no Tauri, no webview (rune-ui spike, card #674)"

[[bin]]
name = "irori-desk"
path = "src/main.rs"

[dependencies]
irori-roles = { workspace = true }
irori-core = { workspace = true }
irori-sys = { workspace = true }
irori-notify = { workspace = true }
# The window's services, without their Tauri commands.
irori-window = { path = "../crates/window", default-features = false }
tokio = { workspace = true }
png = { workspace = true }
# Rune (github.com/StephenSHorton/rune, the person's fork), pinned: Rune is
# pre-release and asks for a rev of dev. Its ogg-audio (symphonia) and
# native-file-dialog stay off.
rune = { git = "https://github.com/StephenSHorton/rune", rev = "5fd9bfa2ec89e6325d6435d95066336d93369d69", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "svg"] }

[dev-dependencies]
tempfile = { workspace = true }

# The Mac's menu-bar item: Rune's Tray is Windows and Linux only.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.25.1"
