[net]
# rsz-term and its portable-pty patch come from the private rust-suzuri repo
# until suzuri PR #96 merges (card #369): fetch with git's own credentials.
git-fetch-with-cli = true

[alias]
# `cargo xtask no-third-party`, `cargo xtask one-test-binary` (architecture.md 7.1).
xtask = "run --quiet -p xtask --"

# Android 15+ phones (Pixel 10) use 16 KB pages: align the app's .so to
# them, or Android warns that the app isn't 16 KB compatible (card #226).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]


[env]
# whisper.cpp (#240): a portable x86-64 CPU build (AVX2/FMA/F16C, the x86-64-v3
# baseline) instead of GGML_NATIVE, which detects nothing under MSVC and would
# tie a release build to the build machine. The x86 flags are ignored on ARM.
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
# cmake-rs replaces CMAKE_<LANG>_FLAGS_RELEASE with the cc crate's flags and
# strips /O2 from them under MSVC, so whisper.cpp built with no optimization
# (one pass ~40 s instead of well under a second). cl.exe also reads options
# from the CL variable, which cmake-rs doesn't touch; other compilers ignore it.
CL = "/O2"
# ...and _CL_ is appended after cl's command line: /MT there wins over the /MD
# that CMake's default release flags carry into whisper.cpp's debug-profile
# builds (whisper-rs-sys switches build types), matching +crt-static below.
_CL_ = "/MT"

# Windows: the C and C++ runtimes linked into irori.exe (#245). Tauri links
# vcruntime statically already, but whisper.cpp (voice, #240) is C++ and
# built /MD pulled in msvcp140.dll, which only machines with the VC++
# Redistributable have. +crt-static builds every C/C++ dependency /MT (cc
# and cmake-rs follow it), so the exe needs nothing beyond Windows itself.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
